server-id: "redstone"
currency: "ellan_coin"
menu-name: "zmenu:机器人租赁"
addon:
  base-url: "http://127.0.0.1:18765"
bridge:
  bind-address: "127.0.0.1"
  port: 18766
  shared-secret: "CHANGE_ME_TO_AT_LEAST_32_RANDOM_CHARACTERS"
rent-options-minutes: [30, 60, 120]
topup-options-coins: [150, 300, 600]
bot-usernames:
  - "BOT_1"
  - "BOT_2"
  - "BOT_3"
  - "BOT_4"
  - "BOT_5"
  - "BOT_6"
  - "BOT_7"
  - "BOT_8"
  - "BOT_9"
  - "BOT_10"

# Combat bots (long-term packages with the combat option): they hold an item handed over with
# /botrent gear <slot> and hit nearby hostile mobs. They never fight players, pets or villagers and
# never pick up items or experience.
combat:
  enabled: true
  interval-ticks: 4          # how often a bot looks for a target
  reach: 3.0                 # vanilla survival reach, measured to the target's hitbox
  line-of-sight: true
  exclude-types:             # mobs that must never be hit (neutral until provoked, bosses, ...)
    - ENDERMAN
    - ZOMBIFIED_PIGLIN
    - PIGLIN
    - PIGLIN_BRUTE
    - WARDEN

# Menus opened by the bridge itself (zMenu inventory names).
package-manage-menu-name: "zmenu:机器人套餐管理"
