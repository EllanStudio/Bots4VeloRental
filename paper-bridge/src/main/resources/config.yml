menu-name: "zmenu:机器人租赁"
addon:
  base-url: "http://127.0.0.1:18765"
bridge:
  bind-address: "127.0.0.1"
  port: 18766
  shared-secret: "CHANGE_ME_TO_AT_LEAST_32_RANDOM_CHARACTERS"
rent-options-minutes: [30, 60, 120]
topup-options-coins: [150, 300, 600]
bot-usernames:
  - "BOT_1"
  - "BOT_2"
  - "BOT_3"
  - "BOT_4"
  - "BOT_5"
  - "BOT_6"
  - "BOT_7"
  - "BOT_8"
  - "BOT_9"
  - "BOT_10"

# Combat bots (long-term packages with the combat option): they hold an item handed over with
# /botrent gear <slot> and hit nearby hostile mobs. They never fight players, pets or villagers and
# never pick up items or experience.
combat:
  enabled: true
  interval-ticks: 4          # how often a bot looks for a target
  reach: 3.0                 # vanilla survival reach, measured to the target's hitbox
  line-of-sight: true        # a clear ray from the eyes to the target's hitbox (any of 3 aim points) is required
  armor-stands: true         # also hit a (non-marker) armor stand that the bot's crosshair is pointing at
  exclude-types:             # mobs that must never be hit (neutral until provoked, bosses, ...)
    - ENDERMAN
    - ZOMBIFIED_PIGLIN
    - PIGLIN
    - PIGLIN_BRUTE
    - WARDEN

# Menus opened by the bridge itself (zMenu inventory names).
package-manage-menu-name: "zmenu:机器人套餐管理"

# Long-term bots: make the view distance equal to the simulation distance. Chunks between the two load but never
# tick, and mobs that walk into them freeze there for good. Applied whenever a bot is (re)placed.
load-radius:
  view-equals-simulation: true

# Around long-term bots, remove mobs frozen in loaded-but-not-ticking chunks when vanilla would have despawned them
# (not persistent, unnamed, untamed, not leashed/riding, not from a bucket, not in a raid, >32 blocks from players).
# Animals, axolotls and villagers are never touched. Mobs with scoreboard tags or plugin data are kept, except data
# from the namespaces listed under ignore-data-namespaces.
frozen-ring-cleanup:
  enabled: true
  interval-seconds: 120
  extra-chunks: 2              # how far past the bot's view distance to look
  categories: [MONSTER, WATER_ANIMAL, WATER_AMBIENT, WATER_UNDERGROUND_CREATURE, AMBIENT]
  exclude-types: []
  ignore-data-namespaces: []
  log: true
