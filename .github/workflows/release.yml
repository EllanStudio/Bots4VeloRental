name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: EllanServer/Bots4Velo
          ref: feat/addon-spi
          path: .deps/Bots4Velo
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      - name: Make Gradle wrappers executable
        run: chmod +x gradlew .deps/Bots4Velo/gradlew
      - name: Publish local Bots4Velo Addon API
        run: .deps/Bots4Velo/gradlew -p .deps/Bots4Velo :addon-api:publishToMavenLocal -PpluginVersion=3.1.0
      - name: Build release
        run: ./gradlew clean check shadowJar -PpluginVersion="${GITHUB_REF_NAME#v}"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          velocity-addon/build/libs/bots4velo-rental-addon-*.jar
          paper-bridge/build/libs/bots4velo-rental-paper-*.jar
          zmenu/*.yml
          --generate-notes --verify-tag
