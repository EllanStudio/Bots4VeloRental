# Long-term package page of the rental menu. Prices come from the addon through PlaceholderAPI.
name: <dark_green>长期挂机套餐
size: 54
enable: true
update-interval: 1000
fillItem:
  material: BLACK_STAINED_GLASS_PANE
  name: ' '
items:
  overview:
    slot: 4
    item:
      material: CLOCK
      name: <green>长期挂机套餐
      lore:
      - <gray>长期挂机池：<white>%botrental_pack_pool_available%/%botrental_pack_pool_size%
      - <gray>我的套餐：<white>%botrental_pack_active_count%/%botrental_pack_max_per_player%
      - ''
      - <yellow>机器人会放置在你当前所在位置，并一直加载周围区块。
      - <yellow>到达指定位置后才开始计时；故障停机的时间会自动顺延。
      - <gray>点击套餐后需要在 30 秒内再点一次确认购买。
  back:
    slot: 0
    item:
      material: ARROW
      name: <yellow>返回按分钟租赁
      lore:
      - <gray>临时租用，按分钟计费
    actions:
    - type: inventory
      inventory: 机器人租赁
  refresh:
    slot: 8
    item:
      material: SUNFLOWER
      name: <green>刷新状态
      lore:
      - <gray>重新获取价格与套餐状态
    commands:
    - botrent status
    actions:
    - type: refresh inventory
  tier_small:
    slot: 9
    item:
      material: COBBLESTONE
      name: <aqua>小档 · 加载 %botrental_offer_small_radius%
      lore:
      - <gray>左侧：普通套餐
      - <gray>右侧：战斗套餐（可保管武器并攻击附近敌对怪物）
  small_1:
    slot: 10
    item:
      material: LIME_DYE
      name: <green>1 天套餐
      lore:
      - <gray>价格：<gold>%botrental_offer_small_1_price% 艾尔岚金币
      - <gray>加载范围：<white>%botrental_offer_small_radius%
      - <yellow>点击购买
    commands:
    - botrent pack small 1
  small_1_combat:
    slot: 14
    item:
      material: IRON_SWORD
      name: <red>1 天战斗套餐
      lore:
      - <gray>价格：<gold>%botrental_offer_small_1_combat_price% 艾尔岚金币
      - <gray>加载范围：<white>%botrental_offer_small_radius%
      - <gray>购买后用 <white>/botrent gear <租赁位> <gray>交给机器人武器
      - <yellow>点击购买
    commands:
    - botrent pack small 1 combat
  small_7:
