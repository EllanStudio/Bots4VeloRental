name: Bots4VeloRental
version: "${version}"
main: dev.ellan.botrental.paper.BotRentalPaperPlugin
api-version: "1.21"
authors: [EllanServer]
description: Redstone economy and location bridge for Bots4Velo Rental
depend: [ExcellentEconomy]
softdepend: [PlaceholderAPI, zMenu]
commands:
  botrent:
    description: 管理挂机机器人租赁
    usage: /botrent
    aliases: [挂机机器人]
permissions:
  botrental.use:
    description: 允许使用机器人租赁
    default: true
  botrental.admin:
    description: 允许管理机器人租赁
    default: op
